<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Joiner</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .buttons { margin-top: 20px; display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 4px; transition: 0.3s; }
        .btn-join { background-color: #28a745; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        button:hover { opacity: 0.8; }
        .output-area { margin-top: 25px; padding: 10px; background: #e9ecef; border-radius: 4px; min-height: 20px; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>Text Joiner</h2>
    
    <div class="field">
        <label>First Part:</label>
        <input type="text" id="str1" placeholder="Type something...">
    </div>

    <div class="field">
        <label>Second Part:</label>
        <input type="text" id="str2" placeholder="Type something...">
    </div>

    <div class="buttons">
        <button id="joinBtn" class="btn-join">Combine</button>
        <button id="resetBtn" class="btn-clear">Clear</button>
    </div>

    <div class="output-area">
        <strong>Result:</strong> <span id="combinedText"></span>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
